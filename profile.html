<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="preload" href="/assets/fonts/ibm-plex-sans-arabic-arabic-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script src="/js/prefs.js"></script>
    <link rel="canonical" href="https://fayad-learning.vercel.app/profile.html" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#0D9488" />
    <meta name="description" content="حساب FAYBIT: بياناتك وتفضيلات العرض وإدارة تقدمك على هذا الجهاز." />
    <title>الملف الشخصي — FAYBIT</title>
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/theme.css" />
    <link rel="stylesheet" href="/css/theme-overrides.css" />
    <link rel="stylesheet" href="/css/shell.css" />
    <link rel="stylesheet" href="/css/account.css" />
    <script src="/js/sw-register.js" defer></script>
    <script src="/js/i18n.js" defer></script>
    <script src="/js/shell.js" defer></script>
    <script src="/js/catalog.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="/js/main-auth.js" defer></script>
    <script type="module" src="/js/account.js"></script>
  </head>
  <body class="ac-body" data-page="profile">
    <a class="fy-skip" href="#main" data-i18n="common.skip">تخطي إلى المحتوى</a>
    <div id="auth-container" hidden></div>
    <header class="ac-top">
      <div class="ac-wrap ac-top-in">
        <a class="ac-brand" href="/index.html" aria-label="FAYBIT"><img src="/assets/brand/logo-mark.svg" alt="" width="32" height="32" /><span>FAYBIT</span></a>
        <nav class="ac-nav" aria-label="حسابي" data-i18n-attr="aria-label:ac.nav">
          <a href="/index.html" data-i18n="ac.home">الرئيسية</a>
          <a href="/dashboard.html" data-i18n="ac.dashboard" >لوحة التقدم</a>
          <a href="/profile.html" data-i18n="ac.profile" aria-current="page">الملف الشخصي</a>
        </nav>
      </div>
    </header>
    <main id="main" class="ac-wrap">
      <header class="pf-head">
        <div class="pf-id" id="pAccount" aria-live="polite"></div>
      </header>

      <section class="pf-strip" id="pSummary" aria-label="ملخص التعلم" data-i18n-attr="aria-label:p.summary"></section>

      <div class="pf-cols">
        <div class="pf-main">
          <section aria-labelledby="pfCoursesT">
            <div class="pf-sec-head"><h2 id="pfCoursesT" data-i18n="pf.courses">التقدم في المسارات</h2><a class="pf-more" href="/dashboard.html" data-i18n="p.seeDash">افتح لوحة التقدم</a></div>
            <ul class="pf-courses" id="pCourses"></ul>
          </section>
          <section aria-labelledby="pfAchT">
            <div class="pf-sec-head"><h2 id="pfAchT" data-i18n="d.ach">الإنجازات</h2></div>
            <ul class="pf-ach" id="pAch"></ul>
          </section>
        </div>
        <aside class="pf-aside">
          <section aria-labelledby="pfDetT">
            <h2 id="pfDetT" class="pf-h3" data-i18n="pf.details">تفاصيل الحساب</h2>
            <dl class="pf-dl" id="pDetails"></dl>
          </section>
          <section aria-labelledby="pDataT">
            <h2 class="pf-h3" id="pDataT" data-i18n="p.data">بيانات هذا الجهاز</h2>
            <p class="ac-note" data-i18n="p.data.note">يُحفظ تقدمك في متصفحك. يمكنك تنزيل نسخة منه أو مسحه بالكامل.</p>
            <div class="ac-row">
              <button type="button" class="ac-btn" id="pExport" data-i18n="p.export">تنزيل نسخة من تقدمي</button>
              <button type="button" class="ac-btn ac-btn-danger" id="pReset" data-i18n="p.reset">مسح تقدمي على هذا الجهاز</button>
            </div>
            <p class="ac-note" id="pMsg" role="status"></p>
          </section>
        </aside>
      </div>
    </main>
  </body>
</html>
