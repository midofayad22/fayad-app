<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - FAYAD Platform</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background: #060913;
            background-image: linear-gradient(135deg, #0b0f19 0%, #02060c 100%);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .auth-card {
            background: rgba(22, 27, 34, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 16px;
            width: 380px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        .auth-card h2 {
            margin-bottom: 25px;
            font-size: 24px;
            color: #fff;
            letter-spacing: 0.5px;
        }
        .auth-card input {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 15px;
            background: rgba(11, 15, 25, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .auth-card input:focus {
            border-color: #3b82f6;
            outline: none;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
        .auth-card button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        #login-btn {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
        }
        #login-btn:hover {
            background: linear-gradient(135deg, #1d4ed8, #1e40af);
            transform: translateY(-1px);
        }
        #signup-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
        }
        #signup-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: #fff;
        }
        #error-msg {
            color: #f87171;
            font-size: 13px;
            margin-top: 12px;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #94a3b8;
            font-size: 13px;
            text-decoration: none;
            transition: color 0.2s;
        }
        .back-link:hover {
            color: #fff;
        }
    </style>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <link rel="apple-touch-icon" href="assets/images/favicon.svg">
    <meta name="apple-mobile-web-app-title" content="FAYAD Learning">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>

    <div class="auth-card">
        <h2>Welcome to FAYAD</h2>
        
        <input type="email" id="email" placeholder="Email Address">
        <input type="password" id="password" placeholder="Password">
        
        <button id="login-btn">Sign In</button>
        <button id="signup-btn">Sign Up</button>
        
        <p id="error-msg"></p>
        
        <a href="index.html" class="back-link">← Back to Home</a>
    </div>

    <script src="js/auth-actions.js"></script>
</body>
</html>
