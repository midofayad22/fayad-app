  <body class="ac-body zg-body" data-page="game">

    <main id="main" class="zg-main">
      <section id="zbMap" class="zg-map" aria-labelledby="zbMapT">
        <div class="zg-wrap">
          <p class="zg-eyebrow" data-i18n="zg.eyebrow">لعبة بقاء</p>
          <h1 id="zbMapT" class="zg-h1">Zombie Survival</h1>
          <p class="zg-lead" id="zbLead"></p>
          <div class="zg-howto" id="zbHow"></div>
          <ol class="zg-locs" id="zbLocs"></ol>
        </div>
      </section>
      <section id="zbPlay" class="zg-play" hidden aria-label="Mission">
        <div class="zg-wrap">
          <div class="zg-bar">
            <button type="button" class="zg-btn ghost" id="zbBack" data-i18n="zg.map">← الخريطة</button>
            <div class="zg-title"><span id="zbLocName" class="zg-loc"></span><h2 id="zbTitle"></h2></div>
            <div class="zg-pts"><span data-i18n="zg.points">نقاط</span> <b id="zbPoints">0</b></div>
          </div>
          <div class="zg-hud" id="zbHud" role="status" aria-live="off">
            <div class="zg-stat hp"><span class="lbl" data-i18n="zg.hp">صحة الملجأ</span><div class="bar"><i id="zbHpBar"></i></div><b id="zbHp">–</b></div>
            <div class="zg-stat sv"><span class="lbl" data-i18n="zg.sv">الناجون</span><div class="pips" id="zbSv"></div></div>
            <div class="zg-stat am"><span class="lbl" data-i18n="zg.ammo">الذخيرة</span><b id="zbAmmo">0</b></div>
            <div class="zg-stat su" id="zbSupBox"><span class="lbl" data-i18n="zg.sup">إمدادات</span><b id="zbSup">0</b></div>
            <div class="zg-stat zz"><span class="lbl" data-i18n="zg.zombies">زومبي</span><b id="zbZ">0</b></div>
            <div class="zg-stat dn"><span class="lbl" data-i18n="zg.dawn">حتى الفجر</span><b id="zbDawn">–</b></div>
          </div>
          <div class="zg-grid">
            <div class="zg-left">
              <div class="zg-stagewrap">
                <div class="zg-stage" id="zbStage" aria-label="Game world"></div>
                <div class="zg-banner" id="zbBanner" aria-live="polite"></div>
              </div>
              <div class="zg-controls">
                <button type="button" class="zg-btn go" id="zbStart" data-i18n="zg.start">▶ ابدأ الموجة</button>
                <button type="button" class="zg-btn" id="zbReset" data-i18n="zg.reset">↺ أعد العالم</button>
                <span class="zg-tip" id="zbTip"></span>
              </div>
              <ul class="zg-legend" id="zbLegend" aria-label="Threats"></ul>
            </div>
            <div class="zg-right">
              <div class="zg-tabs" role="tablist">
                <button type="button" role="tab" class="on" data-tab="brief" data-i18n="zg.tBrief">الإحاطة</button>
                <button type="button" role="tab" data-tab="build" data-i18n="zg.tBuild">البناء (كود)</button>
                <button type="button" role="tab" data-tab="learn" data-i18n="zg.tLearn">تعلّم</button>
              </div>
              <div class="zg-panel" data-panel="brief">
                <p id="zbBrief" class="zg-brief"></p>
                <h3 data-i18n="zg.obj">الأهداف</h3>
                <ul class="zg-obj" id="zbObj"></ul>
              </div>
              <div class="zg-panel" data-panel="build" hidden>
                <div class="ar-tabs" id="zbTabs" role="tablist"></div>
                <div id="zbEditors"></div>
                <p class="zg-note" id="zbRunNote"></p>
              </div>
              <div class="zg-panel" data-panel="learn" hidden>
                <p class="zg-goal" id="zbGoal"></p>
                <dl class="zg-teach" id="zbTeach"></dl>
                <div class="zg-hints"><div id="zbHints"></div>
                  <div class="zg-row"><button type="button" class="zg-btn" id="zbHint" data-i18n="zg.hint">تلميح</button><button type="button" class="zg-btn" id="zbSol" hidden data-i18n="zg.sol">اعرض الحل</button></div>
                  <div class="zg-sol" id="zbSolution" hidden></div></div>
              </div>
            </div>
          </div>
        </div>
        <div class="zg-result" id="zbResult" hidden role="dialog" aria-modal="true" aria-labelledby="zbResT">
          <div class="zg-card">
            <h2 id="zbResT"></h2>
            <div class="zg-stars" id="zbStars" role="img"></div>
            <p id="zbResWhy"></p>
            <ul class="zg-stats" id="zbResStats"></ul>
            <p class="zg-explain" id="zbResExplain"></p>
            <div class="zg-row"><button type="button" class="zg-btn go" id="zbNext" hidden data-i18n="zg.next">المهمة التالية</button><button type="button" class="zg-btn" id="zbRetry" data-i18n="zg.retry">أعد المحاولة</button><button type="button" class="zg-btn ghost" id="zbEdit" data-i18n="zg.edit">عدّل الكود</button></div>
          </div>
        </div>
