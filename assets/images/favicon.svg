<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- تدريج طولي ناعم ومسحوب تماماً زي زرار الـ Sign In -->
    <linearGradient id="btnStyleGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#194fbb" />
      <stop offset="100%" stop-color="#091552" />
    </linearGradient>

    <!-- ظل خارجي خفيف جداً يخلي الأيقونة بارزة برقة -->
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- خلفية الأيقونة بنفس حواف وبنية الزرار -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#btnStyleGradient)" filter="url(#subtleShadow)" />

  <!-- حرف الـ F متناسق ونظيف تماماً في المنتصف -->
  <text x="51%" y="56%" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="280" fill="#ffffff" dominant-baseline="middle" text-anchor="middle">F</text>
</svg>