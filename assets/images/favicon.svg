<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- تدرج خلفية الأيقونة (من الأزرق الفاتح إلى الوردي الناعم) -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#084a4e" />
      <stop offset="50%" stop-color="#068d84" />
      <stop offset="100%" stop-color="#0a4e45" />
    </linearGradient>

    <!-- تدرج حرف الـ F (يبدأ بالأزرق وينتهي بالوردي المتداخل الممسوح) -->
    <linearGradient id="fGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f8f8" />
      <stop offset="50%" stop-color="#d3dfdf" />
      <stop offset="100%" stop-color="#0c6769" />
    </linearGradient>

    <!-- ظل خفيف لإعطاء عمق للأيقونة -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- خلفية الأيقونة بزوايا دائرية -->
  <rect x="50" y="50" width="400" height="400" rx="90" fill="url(#bgGradient)" filter="url(#shadow)" />

  <!-- حرف F بتصميم واضح وعادي مع التدرج اللوني -->
  <text x="50%" y="54%" 
        dominant-baseline="middle" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-weight="800" 
        font-size="220" 
        fill="url(#fGradient)" 
        filter="url(#shadow)">F</text>
</svg>